# Mantém o site acordado no plano grátis do Render, que "dorme" depois de
# 15 minutos sem acesso. O GitHub às vezes atrasa alguns minutos o agendamento,
# por isso roda a cada 5 minutos.
name: Manter site acordado

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: # permite rodar na mão pela aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Acessar o site
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 90 \
            -o /dev/null -w "HTTP %{http_code} em %{time_total}s\n" \
            https://almada-outlet.onrender.com/api/settings
